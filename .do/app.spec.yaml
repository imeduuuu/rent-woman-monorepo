name: rent-woman
region: fra
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

ingress:
  rules:
    - match:
        path:
          prefix: /api
      component:
        name: api
    - match:
        path:
          prefix: /health
      component:
        name: api
    - match:
        path:
          prefix: /socket.io
      component:
        name: api
    - match:
        path:
          prefix: /n8n
      component:
        name: n8n
    - match:
        path:
          prefix: /
      component:
        name: web

databases:
  - name: db
    cluster_name: rent-woman-pg
    engine: PG
    production: true
  - name: cache
    cluster_name: rent-woman-redis
    engine: REDIS
    production: true

services:
  - name: api
    git:
      repo_clone_url: https://github.com/imeduuuu/rent-woman-monorepo.git
      branch: main
    source_dir: /
    build_command: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @repo/types build && corepack pnpm --filter @repo/db prisma:generate && corepack pnpm --filter @repo/db build && corepack pnpm --filter @repo/api build
    run_command: corepack pnpm --filter @repo/api start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 4000
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        value: "4000"
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_TIME
        type: SECRET
        value: ${APP_URL}
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_TIME
        type: SECRET
        value: ${APP_URL}
      - key: INTERNAL_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: change-this-in-every-environment
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      - key: DIRECT_URL
        scope: RUN_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      - key: REDIS_URL
        scope: RUN_TIME
        type: SECRET
        value: ${cache.DATABASE_URL}
      - key: SOCKET_AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
        value: replace-with-an-hmac-secret
      - key: N8N_BASE_URL
        scope: RUN_TIME
        value: ${n8n.INTERNAL_URL}
      - key: AGENTS_INTERNAL_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: local-agent-token-12345

  - name: web
    git:
      repo_clone_url: https://github.com/imeduuuu/rent-woman-monorepo.git
      branch: main
    source_dir: /
    build_command: corepack pnpm install --frozen-lockfile && corepack pnpm --filter @repo/db prisma:generate && corepack pnpm --filter @repo/web build
    run_command: corepack pnpm --filter @repo/web start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    http_port: 3000
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: NEXT_PUBLIC_APP_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: ${APP_URL}
      - key: NEXT_PUBLIC_API_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: ${APP_URL}
      - key: DATABASE_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: ${db.DATABASE_URL}
      - key: DIRECT_URL
        scope: RUN_AND_BUILD_TIME
        type: SECRET
        value: ${db.DATABASE_URL}

  - name: n8n
    image:
      registry_type: DOCKER_HUB
      registry: n8nio
      repository: n8n
      tag: latest
    http_port: 5678
    envs:
      - key: N8N_HOST
        value: 0.0.0.0
      - key: N8N_PORT
        value: "5678"
      - key: N8N_PROTOCOL
        value: http
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_URL
        value: ${APP_URL}/n8n/
      - key: N8N_PATH
        value: /n8n/
      - key: N8N_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: internal-n8n-encryption-key-123
      - key: AGENTS_INTERNAL_TOKEN
        scope: RUN_TIME
        type: SECRET
        value: local-agent-token-12345
